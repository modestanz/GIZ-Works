<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:520px;font-family:Carlito,Calibri,"Liberation Sans",sans-serif;background:#fff;color:#1d2b22}
#c{position:relative;width:1200px;height:520px}
.lab{position:absolute;left:10px;width:230px;font-size:16px;line-height:1.1;display:flex;align-items:center;height:30px}
.lab.g{font-weight:700;color:#1F5135}
.bar{position:absolute;height:24px;border-radius:3px;font-size:13.5px;color:#fff;padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.peak{position:absolute;background:#f6f0dc}
.yr{position:absolute;top:8px;font-weight:700;font-size:16px;color:#1F5135;text-align:center}
.q{position:absolute;top:32px;font-size:12.5px;color:#555;text-align:center}
.vl{position:absolute;top:28px;width:1px;background:#cfd8d2}
.gate{position:absolute;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:18px solid #b03a2e}
.gl{position:absolute;font-size:13px;font-weight:700;color:#b03a2e;white-space:nowrap}
.leg{position:absolute;bottom:8px;left:250px;font-size:14px;display:flex;gap:22px;align-items:center}
.sw{display:inline-block;width:18px;height:12px;margin-right:6px;vertical-align:middle;border-radius:2px}
</style></head><body><div id="c"></div>
<script>
const c=document.getElementById('c');
const X0=250, X1=1185, M=38; // Nov 2026 .. Dec 2029 = 38 months
const mw=(X1-X0)/M; const x=m=>X0+m*mw; // m=0 => Nov 2026
const mi=(y,mo)=>(y-2026)*12+(mo-11); // month index
const add=(cls,st,html)=>{const d=document.createElement('div');d.className=cls;Object.assign(d.style,st);if(html)d.innerHTML=html;c.appendChild(d);return d};
const TOP=58, ROW=33, rows=12, H=TOP+rows*ROW;
// peak seasons Jun-Oct
[2027,2028,2029].forEach(y=>add('peak',{left:x(mi(y,6))+'px',top:'28px',width:(5*mw)+'px',height:(H-28)+'px'}));
// years and quarters
[[2026,11,12],[2027,1,12],[2028,1,12],[2029,1,12]].forEach(([y,a,b])=>{const s=mi(y,a),e=mi(y,b)+1;add('yr',{left:x(s)+'px',width:(x(e)-x(s))+'px'},String(y));add('vl',{left:x(s)+'px',height:(H-28)+'px'});});
for(let y=2027;y<=2029;y++)for(let q=0;q<4;q++){const s=mi(y,1+3*q);add('q',{left:x(s)+'px',width:(3*mw)+'px'},'Q'+(q+1));}
add('q',{left:x(0)+'px',width:(2*mw)+'px'},'Q4');
const R=(i,label,g)=>add('lab'+(g?' g':''),{top:(TOP+i*ROW)+'px'},label);
const B=(i,s,e,col,txt)=>add('bar',{top:(TOP+i*ROW+3)+'px',left:x(s)+'px',width:(x(e)-x(s)-2)+'px',background:col},txt||'');
const G='#1F5135',G2='#3D6B50',Au='#a8892f',Gy='#6b7f74',Lg='#7fa58c';
R(0,'Phases',true);
B(0,0,mi(2027,2),Gy,'0 Set-up');B(0,mi(2027,2),mi(2027,5),Au,'1 Design');B(0,mi(2027,5),mi(2028,4),G,'2 Season one');B(0,mi(2028,4),mi(2029,4),G2,'3 Season two + review');B(0,mi(2029,7),M,Lg,'4 Scale');
R(1,'1.2.1 Platforms PA1, PA2',true);B(1,mi(2027,1),M,G2,'Quarterly cycle: clinics, deal days, anchor roundtables');
R(2,'1.2.1 Zambezi Region (NA)');B(2,mi(2027,7),M,Lg,'Platform and second-cohort preparation');
R(3,'1.2.2 Lot 1 windows',true);B(3,mi(2027,4),mi(2027,7),Au,'Window 1');B(3,mi(2027,11),mi(2028,2),Au,'Window 2');B(3,mi(2028,11),mi(2029,2),Au,'Window 3');
R(4,'1.2.2 Lot 2 call and awards',true);B(4,mi(2027,5),mi(2027,10),Au,'Call and awards');B(4,mi(2028,2),mi(2028,6),Au,'Round 2');
R(5,'1.2.3 Agreements',true);B(5,mi(2027,1),mi(2027,6),G,'Agreements signed');
R(6,'1.2.3 Order-backed finance');B(6,mi(2027,5),mi(2029,4),G,'Pre-peak working capital, two seasons');
R(7,'1.2.3 Asset finance (Model A)');B(7,mi(2027,11),mi(2029,4),G,'Low-season disbursement with grace');
R(8,'1.2.3 Lot 2 to finance pilot');B(8,mi(2027,9),mi(2029,4),G2,'Screened grantees to RTFF and guarantee windows');
R(9,'1.2.3 Models C and D');B(9,mi(2027,7),mi(2028,4),Gy,'Design');B(9,mi(2028,4),mi(2029,4),G2,'Pilot');
R(10,'M&E',true);B(10,mi(2027,1),mi(2027,6),Gy,'Baselines');B(10,mi(2027,6),mi(2029,4),Lg,'Monitoring and dashboard');B(10,mi(2029,1),mi(2029,7),G,'Evaluation');
R(11,'RTFF',true);B(11,mi(2027,4),mi(2029,4),'#5b6f9e','Cohort 1 (TUI Care Foundation)');
// gates
[[mi(2028,2),'Gate 1'],[mi(2029,2),'Gate 2'],[mi(2028,11),'RTFF future']].forEach(([m,t])=>{add('gate',{left:(x(m)-11)+'px',top:(H+2)+'px'});add('gl',{left:(x(m)-24)+'px',top:(H+22)+'px'},t);});
const l=add('leg',{});l.innerHTML='<span><span class="sw" style="background:#f6f0dc;border:1px solid #d8c88f"></span>Peak tourism season (June–October)</span><span><span class="sw" style="background:#b03a2e"></span>Decision gate</span><span>Indicative; assumes Partner State decisions in November 2026</span>';
</script></body></html>
